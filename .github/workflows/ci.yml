name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Default GITHUB_TOKEN is often read-only; jobs that need more declare it below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrender-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev

      - name: Check Format & Compilation
        run: cargo check --all-targets

      - name: Run Tests
        run: cargo test --verbose

  build-release-packages:
    name: Build & Package Release Artifacts
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Required for softprops/action-gh-release to create/update releases.
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrender-dev libwayland-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev wget desktop-file-utils

      - name: Install Packaging Tools
        run: |
          cargo install cargo-deb || true
          cargo install cargo-generate-rpm || true

      - name: Build Release Binary
        run: cargo build --release

      - name: Extract Cargo Version
        id: get_version
        run: |
          VERSION="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{ if (match($0,/"[^"]+"/)) { print substr($0,RSTART+1,RLENGTH-2); exit } }' Cargo.toml)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate DEB Package
        run: |
          mkdir -p target/debian
          cargo deb --no-build

      - name: Generate RPM Package
        run: |
          mkdir -p target/generate-rpm
          cargo generate-rpm -o "target/generate-rpm/vectrace-${{ steps.get_version.outputs.version }}-1.x86_64.rpm"

      - name: Generate AppImage
        run: bash packaging/appimage/build-appimage.sh

      - name: Create Release Tarball
        run: |
          mkdir -p target/dist
          cp target/release/vectrace target/dist/
          cp assets/com.vectrace.Vectrace.desktop target/dist/
          cp assets/vectrace.svg target/dist/
          cp README.md target/dist/ 2>/dev/null || true
          tar -czf target/vectrace-x86_64-unknown-linux-gnu.tar.gz -C target/dist .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vectrace-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/*.AppImage
            target/*.tar.gz

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          name: Vectrace ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          generate_release_notes: true
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/*.AppImage
            target/*.tar.gz

