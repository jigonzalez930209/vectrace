<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>

    <!-- Neon Path Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000fe" />
    </linearGradient>

    <!-- Highlighter Trail Gradient -->
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Icon Frame -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Background Grid Subtle Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="128" y1="32" x2="128" y2="480" />
    <line x1="256" y1="32" x2="256" y2="480" />
    <line x1="384" y1="32" x2="384" y2="480" />
    <line x1="32" y1="128" x2="480" y2="128" />
    <line x1="32" y1="256" x2="480" y2="256" />
    <line x1="32" y1="384" x2="480" y2="384" />
  </g>

  <!-- Wide Smooth Ribbon (Highlighter effect) -->
  <path d="M 100 360 C 180 340, 220 180, 320 160 C 370 150, 400 210, 420 220" 
        fill="none" 
        stroke="url(#trail-grad)" 
        stroke-width="36" 
        stroke-linecap="round" />

  <!-- Neon Glowing Vector Spline -->
  <path d="M 90 350 C 180 330, 210 160, 320 150 C 380 145, 400 230, 420 200" 
        fill="none" 
        stroke="url(#laser-grad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#neon-glow)" />

  <!-- Core White Laser Line -->
  <path d="M 90 350 C 180 330, 210 160, 320 150 C 380 145, 400 230, 420 200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Vector Control Nodes -->
  <circle cx="90" cy="350" r="10" fill="#00f2fe" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)" />
  <circle cx="320" cy="150" r="10" fill="#4facfe" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)" />
  <circle cx="420" cy="200" r="12" fill="#ff0844" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)" />

  <!-- Cursor / Stylus Tip Overlay -->
  <g transform="translate(420, 200) rotate(-45)">
    <polygon points="0,0 -16,-36 36,-16" fill="#ffffff" filter="url(#neon-glow)" />
  </g>
</svg>
