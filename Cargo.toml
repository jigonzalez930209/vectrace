[package]
name = "vectrace"
version = "0.1.0"
edition = "2024"

[dependencies]
tiny-skia = "0.11"
x11rb = { version = "0.13", features = ["all-extensions"] }
fontdue = "0.9"

wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "0.38", features = ["shm", "mm", "fs", "std"] }

