[package]
name = "vectrace"
version = "0.1.0"
edition = "2024"
authors = ["Vectrace Developers"]
description = "Agnostic vector screen marker and drawing overlay for X11 and Wayland"
repository = "https://github.com/jigonzalez930209/vectrace"
license = "GPL-3.0-only"
keywords = ["screen-marker", "drawing", "wayland", "x11", "gui"]
categories = ["graphics", "utility"]

[dependencies]
tiny-skia = "0.11"
x11rb = { version = "0.13", features = ["all-extensions"] }
fontdue = "0.9"

wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "0.38", features = ["shm", "mm", "fs", "std"] }
ksni = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
zbus = "5.18"
ashpd = "0.10"
urlencoding = "2.1"
pipewire = "0.8"
signal-hook-registry = "1.4"
arboard = "3"
futures-lite = "2.6.1"
resvg = "0.45"

[package.metadata.deb]
maintainer = "Vectrace Developers"
copyright = "2026, Vectrace Developers"
extended-description = """
Vectrace is a high-performance pure-software screen marker and vector drawing overlay tool designed for Linux.
It supports X11 and Wayland (via Layer-Shell and XDG-Shell), featuring spline stroke smoothing, glassmorphic floating toolbar, system tray integration, neon laser mode, spotlight mode, and custom shape tools.
"""
assets = [
    ["target/release/vectrace", "usr/bin/vectrace", "755"],
    ["assets/com.vectrace.Vectrace.desktop", "usr/share/applications/com.vectrace.Vectrace.desktop", "644"],
    ["assets/vectrace.svg", "usr/share/icons/hicolor/scalable/apps/vectrace.svg", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vectrace", dest = "/usr/bin/vectrace", mode = "0755" },
    { source = "assets/com.vectrace.Vectrace.desktop", dest = "/usr/share/applications/com.vectrace.Vectrace.desktop", mode = "0644" },
    { source = "assets/vectrace.svg", dest = "/usr/share/icons/hicolor/scalable/apps/vectrace.svg", mode = "0644" },
]






